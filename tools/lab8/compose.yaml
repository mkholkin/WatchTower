services:
  postgres:
    image: ${LAB4_POSTGRES_IMAGE}
    cpuset: '1'
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: lab4-only
    command: [postgres, -c, shared_preload_libraries=pg_cron, -c, cron.database_name=postgres]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 1s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-bookworm
    cpuset: '1'
    cpus: 0.25
    mem_limit: 128m
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 30
  probe:
    image: ${LAB4_APP_IMAGE}
    cpuset: '1'
    cpus: 0.1
    mem_limit: 128m
    entrypoint: [python3, tools/lab2/probe.py]
    networks:
      default:
        aliases: [example.com]
  rdap-mock:
    image: ${LAB4_APP_IMAGE}
    cpuset: '1'
    cpus: 0.25
    mem_limit: 128m
    entrypoint: [python3, tools/lab8/rdap_mock.py]
    ports: ["127.0.0.1:${LAB8_MOCK_PORT:-0}:8089"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8089/__admin/stats]
      interval: 1s
      timeout: 3s
      retries: 30
  api:
    image: ${LAB4_APP_IMAGE}
    cpuset: '0'
    cpus: 1
    mem_limit: 768m
    environment:
      GIN_MODE: release
      GOMAXPROCS: '1'
    entrypoint: [watchtower-api, /config.json]
    ports: ["127.0.0.1:${LAB8_API_PORT:-0}:8080"]
    volumes:
      - ${LAB4_CONFIG}:/config.json:ro
    depends_on:
      rdap-mock:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/openapi.yaml]
      interval: 2s
      timeout: 3s
      retries: 60
  load:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpuset: '2'
    cpus: 1
    mem_limit: 512m
    user: ${LAB4_UID}:${LAB4_GID}
    environment:
      LAB4_PROFILE: ${LAB4_PROFILE}
      LAB4_SMOKE: ${LAB4_SMOKE}
      LAB4_TARGET_URL: http://example.com:8081/health
      LAB8_RDAP: '1'
    command: [run, --out, 'json=/artifacts/requests.jsonl', /scripts/journey.js]
    volumes:
      - ../../tests/lab4:/scripts:ro
      - ${LAB4_OUTPUT}:/artifacts
  tests:
    image: ${LAB4_APP_IMAGE}
    profiles: [tests]
    user: ${LAB4_UID}:${LAB4_GID}
    entrypoint: [python3, tools/lab8/e2e.py]
    environment:
      LAB8_API_URL: http://api:8080
      LAB8_MODE: ${LAB8_MODE:-mock}
      LAB8_DEMO: ${LAB8_DEMO:-0}
      LAB8_OUTPUT: /artifacts
      LAB8_MOCK_URL: http://rdap-mock:8089
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ${LAB4_OUTPUT}:/artifacts
  collector:
    image: ${LAB4_APP_IMAGE}
    profiles: [monitor]
    cpuset: '3'
    cpus: 0.25
    mem_limit: 256m
    entrypoint: [python3, /collector.py]
    environment:
      LAB4_CONTAINERS: ${LAB4_CONTAINERS:-'{}'}
    volumes:
      - ../lab4/collect.py:/collector.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - ${LAB4_OUTPUT}:/artifacts
volumes:
  database:
