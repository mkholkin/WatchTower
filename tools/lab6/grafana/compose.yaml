services:
  prometheus:
    image: prom/prometheus:v3.15.1
    user: ${LAB6_UID}:${LAB6_GID}
    cpus: 1
    mem_limit: 768m
    ports: ['127.0.0.1:9096:9090']
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=3650d]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ${LAB6_GRAFANA_DATA}/prometheus-data:/prometheus
      - ${LAB6_GRAFANA_DATA}:/imports:ro
  tempo:
    image: grafana/tempo:2.9.0
    user: ${LAB6_UID}:${LAB6_GID}
    cpus: 1
    mem_limit: 1g
    command: [-config.file=/etc/tempo.yaml]
    ports: ['127.0.0.1:3206:3200', '127.0.0.1:4316:4318']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ${LAB6_GRAFANA_DATA}/tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:13.3.0
    user: ${LAB6_UID}:${LAB6_GID}
    cpus: 1
    mem_limit: 768m
    ports: ['127.0.0.1:3036:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ${LAB6_GRAFANA_DATA}/dashboards:/var/lib/grafana/dashboards:ro
      - ${LAB6_GRAFANA_DATA}/grafana-data:/var/lib/grafana
