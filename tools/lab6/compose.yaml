services:
  postgres:
    image: ${LAB4_POSTGRES_IMAGE}
    cpuset: '1'
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: lab4-only
    command: [postgres, -c, shared_preload_libraries=pg_cron, -c, cron.database_name=postgres]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 1s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-bookworm
    cpuset: '1'
    cpus: 0.25
    mem_limit: 128m
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 30
  probe:
    image: ${LAB4_APP_IMAGE}
    cpuset: '1'
    cpus: 0.1
    mem_limit: 128m
    entrypoint: [python3, tools/lab2/probe.py]
  api:
    image: ${LAB4_APP_IMAGE}
    cpuset: '0'
    cpus: 1
    mem_limit: 768m
    environment:
      GIN_MODE: release
      GOMAXPROCS: '1'
      WT_TRACE_FILE: ${LAB6_TRACE_FILE:-}
      WT_HTTP_DEBUG: ${LAB6_HTTP_DEBUG:-false}
    user: ${LAB4_UID}:${LAB4_GID}
    entrypoint: [watchtower-api, /config.json]
    volumes:
      - ${LAB4_CONFIG}:/config.json:ro
      - ${LAB4_OUTPUT}:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/openapi.yaml]
      interval: 2s
      timeout: 3s
      retries: 60
  load:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpuset: '2'
    cpus: 1
    mem_limit: 512m
    user: ${LAB4_UID}:${LAB4_GID}
    environment:
      LAB4_PROFILE: ${LAB4_PROFILE}
      LAB4_SMOKE: ${LAB4_SMOKE}
    command: [run, --out, 'json=/artifacts/requests.jsonl', /scripts/journey.js]
    volumes:
      - ../../tests/lab4:/scripts:ro
      - ${LAB4_OUTPUT}:/artifacts
  collector:
    image: ${LAB4_APP_IMAGE}
    profiles: [monitor]
    cpuset: '3'
    cpus: 0.25
    mem_limit: 256m
    entrypoint: [python3, /collector.py]
    environment:
      LAB4_CONTAINERS: ${LAB4_CONTAINERS:-'{}'}
    volumes:
      - ../lab4/collect.py:/collector.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - ${LAB4_OUTPUT}:/artifacts
volumes:
  database:
