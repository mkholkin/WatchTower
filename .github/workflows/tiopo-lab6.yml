name: TIOPO — tracing and logging overhead
on:
  push:
    branches: [TIOPO-6]
  pull_request:
    paths:
      - tools/lab6/**
      - tools/lab4/**
      - tests/lab4/**
      - internal/**
      - configs/**
      - cmd/api/**
      - migrations/**
      - api/**
      - Dockerfile.postgres
      - tools/lab1/package*.json
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/tiopo-lab6.yml
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run all 20 full-duration experiments'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tiopo-lab6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check tracing correlation and redaction
        run: go test -race ./internal/observability ./cmd/api
      - name: Check workload and runner failure paths
        run: make lab6-check
      - name: Verify four OpenTelemetry and logging modes quickly
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_matrix }}
        run: python3 tools/lab6/run.py --smoke --profile soak-0
      - name: Run all 20 full-duration experiments when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
        run: make lab6
      - name: Import measurements into Grafana and verify Prometheus and Tempo
        run: make lab6-grafana
      - name: Stop Grafana viewer
        if: always()
        run: make lab6-grafana-down
      - name: Publish measurements, OTLP exports, shutdown integrity and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiopo-lab6-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/lab6/runs
            build/lab6/grafana/*/import.json
            build/lab6/grafana/*/metrics.om
            build/lab6/grafana/*/dashboards
            build/lab6/grafana/*/traces-import.json
            build/lab6/grafana/*/query-checks.json
            build/lab6/grafana/*/viewer-resources.json*
          retention-days: 14
          if-no-files-found: error
