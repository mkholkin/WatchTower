name: TIOPO — microbenchmarks
on:
  push:
    branches: [TIOPO-3]
  pull_request:
    paths:
      - benchmarks/lab3/**
      - tools/lab3/**
      - internal/api/http/v1/gen/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/tiopo-lab3.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiopo-lab3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  microbenchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Check equivalence, phase accounting and statistics
        run: make lab3-check
      - name: 100 isolated single-CPU trials and Allure report
        run: make lab3
      - name: Publish raw measurements, plots and Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiopo-lab3-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab3/runs
          retention-days: 14
          if-no-files-found: error
