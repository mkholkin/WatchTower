name: TIOPO — unit, integration, E2E
on:
  push:
    branches: [TIOPO-2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiopo-lab2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: build/lab2/history
          key: allure-lab2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-lab2-${{ github.ref_name }}-
      - name: Unit → integration → E2E in Docker
        run: make lab2
      - name: Save Allure history even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/lab2/history
          key: allure-lab2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish reports, cleanup evidence and captured traffic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiopo-lab2-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab2
          retention-days: 14
