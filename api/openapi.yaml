openapi: 3.1.0

info:
  title: WatchTower API
  description: |
    Public REST API for configuring HTTP monitors, alert contacts and
    maintenance windows, and for reading checks, status history and SLA.
    Version 2 replaces action-style endpoints with resource updates and
    relationship resources.
  version: 2.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: Registration and access-token operations.
  - name: Monitors
    description: Monitor configuration and lifecycle.
  - name: Metrics
    description: Checks, status history and SLA.
  - name: Alert Contacts
    description: Telegram alert contacts.
  - name: Maintenance Windows
    description: Planned and manual maintenance windows.

security:
  - BearerAuth: []

paths:
  /api/v2/users:
    post:
      tags: [Authentication]
      security: []
      summary: Register a user
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
            examples:
              default:
                $ref: '#/components/examples/UserCredentialsExample'
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
              examples:
                default:
                  $ref: '#/components/examples/UserCreatedExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/auth/tokens:
    post:
      tags: [Authentication]
      security: []
      summary: Create an access token
      operationId: LoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
            examples:
              default:
                $ref: '#/components/examples/UserCredentialsExample'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              examples:
                default:
                  $ref: '#/components/examples/AccessTokenExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      operationId: ListMonitors
      responses:
        '200':
          description: Monitors owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monitor'
              examples:
                default:
                  $ref: '#/components/examples/MonitorListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Monitors]
      summary: Create a monitor
      operationId: CreateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
            examples:
              default:
                $ref: '#/components/examples/MonitorCreateExample'
      responses:
        '201':
          description: Monitor created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
              examples:
                default:
                  $ref: '#/components/examples/MonitorExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors/{monitorId}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Monitors]
      summary: Get a monitor
      operationId: GetMonitor
      responses:
        '200':
          description: Monitor details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
              examples:
                default:
                  $ref: '#/components/examples/MonitorExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Monitors]
      summary: Partially update a monitor
      description: Only properties present in the request are changed.
      operationId: PatchMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorPatch'
            examples:
              default:
                $ref: '#/components/examples/MonitorPatchExample'
      responses:
        '200':
          description: Updated monitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
              examples:
                default:
                  $ref: '#/components/examples/MonitorExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      operationId: DeleteMonitor
      responses:
        '204':
          description: Monitor deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors/{monitorId}/checks:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Metrics]
      summary: List monitor checks
      operationId: ListMonitorChecks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Probe summaries ordered from newest to oldest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitorCheck'
              examples:
                default:
                  $ref: '#/components/examples/MonitorChecksExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors/{monitorId}/sla:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Metrics]
      summary: Get monitor SLA
      operationId: GetMonitorSLA
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: SLA for the requested period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorSLA'
              examples:
                default:
                  $ref: '#/components/examples/MonitorSLAExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors/{monitorId}/status-history:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Metrics]
      summary: List monitor status intervals
      operationId: ListMonitorStatusHistory
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Status intervals intersecting the requested period.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitorStatusInterval'
              examples:
                default:
                  $ref: '#/components/examples/MonitorStatusHistoryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/monitors/{monitorId}/alert-contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - $ref: '#/components/parameters/ContactId'
    put:
      tags: [Monitors]
      summary: Attach an alert contact to a monitor
      operationId: AttachAlertContact
      responses:
        '204':
          description: Relationship created or already present.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Monitors]
      summary: Detach an alert contact from a monitor
      operationId: DetachAlertContact
      responses:
        '204':
          description: Relationship removed or already absent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/alert-contacts:
    get:
      tags: [Alert Contacts]
      summary: List alert contacts
      operationId: ListAlertContacts
      responses:
        '200':
          description: Alert contacts owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertContact'
              examples:
                default:
                  $ref: '#/components/examples/AlertContactListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Alert Contacts]
      summary: Create an alert contact
      operationId: CreateAlertContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertContactCreate'
            examples:
              default:
                $ref: '#/components/examples/AlertContactCreateExample'
      responses:
        '201':
          description: Alert contact created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContact'
              examples:
                default:
                  $ref: '#/components/examples/AlertContactExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/alert-contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [Alert Contacts]
      summary: Get an alert contact
      operationId: GetAlertContact
      responses:
        '200':
          description: Alert contact details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContact'
              examples:
                default:
                  $ref: '#/components/examples/AlertContactExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Alert Contacts]
      summary: Partially update an alert contact
      operationId: PatchAlertContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertContactPatch'
            examples:
              default:
                $ref: '#/components/examples/AlertContactPatchExample'
      responses:
        '200':
          description: Updated alert contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContact'
              examples:
                default:
                  $ref: '#/components/examples/AlertContactExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Alert Contacts]
      summary: Delete an alert contact
      operationId: DeleteAlertContact
      responses:
        '204':
          description: Alert contact deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/maintenance-windows:
    get:
      tags: [Maintenance Windows]
      summary: List maintenance windows
      operationId: ListMaintenanceWindows
      responses:
        '200':
          description: Maintenance windows owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceWindow'
              examples:
                default:
                  $ref: '#/components/examples/MaintenanceWindowListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Maintenance Windows]
      summary: Create a maintenance window
      operationId: CreateMaintenanceWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceWindowCreate'
            examples:
              default:
                $ref: '#/components/examples/MaintenanceWindowCreateExample'
      responses:
        '201':
          description: Maintenance window created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
              examples:
                default:
                  $ref: '#/components/examples/MaintenanceWindowExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/maintenance-windows/{windowId}:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    get:
      tags: [Maintenance Windows]
      summary: Get a maintenance window
      operationId: GetMaintenanceWindow
      responses:
        '200':
          description: Maintenance window details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
              examples:
                default:
                  $ref: '#/components/examples/MaintenanceWindowExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Maintenance Windows]
      summary: Partially update a maintenance window
      operationId: PatchMaintenanceWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceWindowPatch'
            examples:
              default:
                $ref: '#/components/examples/MaintenanceWindowPatchExample'
      responses:
        '200':
          description: Updated maintenance window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
              examples:
                default:
                  $ref: '#/components/examples/MaintenanceWindowExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Maintenance Windows]
      summary: Delete a maintenance window
      operationId: DeleteMaintenanceWindow
      responses:
        '204':
          description: Maintenance window deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/maintenance-windows/{windowId}/monitors/{monitorId}:
    parameters:
      - $ref: '#/components/parameters/WindowId'
      - $ref: '#/components/parameters/MonitorId'
    put:
      tags: [Maintenance Windows]
      summary: Attach a monitor to a maintenance window
      operationId: AttachMonitorToMaintenanceWindow
      responses:
        '204':
          description: Relationship created or already present.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Maintenance Windows]
      summary: Detach a monitor from a maintenance window
      operationId: DetachMonitorFromMaintenanceWindow
      responses:
        '204':
          description: Relationship removed or already absent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    Location:
      description: URI of the newly created resource.
      schema:
        type: string
        format: uri-reference
      example: /api/v2/monitors/1b6cae53-a014-4b79-843c-6433ad451b4e

  parameters:
    MonitorId:
      name: monitorId
      in: path
      required: true
      description: Monitor UUID.
      schema:
        $ref: '#/components/schemas/UUID'
    ContactId:
      name: contactId
      in: path
      required: true
      description: Alert-contact UUID.
      schema:
        $ref: '#/components/schemas/UUID'
    WindowId:
      name: windowId
      in: path
      required: true
      description: Maintenance-window UUID.
      schema:
        $ref: '#/components/schemas/UUID'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of checks to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower timestamp bound.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: false
      description: Inclusive upper timestamp bound.
      schema:
        $ref: '#/components/schemas/Timestamp'

  responses:
    BadRequest:
      description: Request syntax or values are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/BadRequestExample'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Authentication scheme required to access the resource.
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedExample'
    Forbidden:
      description: The authenticated user does not own the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenExample'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/NotFoundExample'
    Conflict:
      description: The requested state conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/ConflictExample'
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              $ref: '#/components/examples/InternalErrorExample'

  schemas:
    UUID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    UserCredentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    UserCreated:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login:
          type: string

    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          enum: [Bearer]

    MonitorStatus:
      type: string
      enum: [up, down, maintenance, unknown]

    HTTPMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]

    HTTPConfig:
      type: object
      additionalProperties: false
      required: [method, follow_redirects]
      properties:
        method:
          $ref: '#/components/schemas/HTTPMethod'
        headers:
          type: object
          additionalProperties:
            type: string
          default: {}
        body:
          type: string
        follow_redirects:
          type: boolean

    HTTPExpectations:
      type: object
      additionalProperties: false
      required: [expected_status_codes, max_response_time_ms]
      properties:
        expected_status_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 100
            maximum: 599
        max_response_time_ms:
          type: integer
          minimum: 1

    MonitorCreate:
      type: object
      additionalProperties: false
      required:
        - label
        - endpoint
        - probe_interval_sec
        - network_config
        - expectations
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        endpoint:
          type: string
          format: uri
        probe_interval_sec:
          type: integer
          minimum: 1
        network_config:
          $ref: '#/components/schemas/HTTPConfig'
        expectations:
          $ref: '#/components/schemas/HTTPExpectations'
        alert_contact_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUID'
          default: []
        maintenance_window_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUID'
          default: []

    MonitorPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        endpoint:
          type: string
          format: uri
        probe_interval_sec:
          type: integer
          minimum: 1
        network_config:
          $ref: '#/components/schemas/HTTPConfig'
        expectations:
          $ref: '#/components/schemas/HTTPExpectations'
        is_enabled:
          type: boolean

    Monitor:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - endpoint
        - protocol
        - probe_interval_sec
        - network_config
        - expectations
        - is_enabled
        - status
        - alert_contact_ids
        - maintenance_window_ids
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        label:
          type: string
        description:
          type: string
        endpoint:
          type: string
          format: uri
        protocol:
          type: string
          enum: [HTTP]
        probe_interval_sec:
          type: integer
          minimum: 1
        network_config:
          $ref: '#/components/schemas/HTTPConfig'
        expectations:
          $ref: '#/components/schemas/HTTPExpectations'
        is_enabled:
          type: boolean
        status:
          $ref: '#/components/schemas/MonitorStatus'
        alert_contact_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        maintenance_window_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    MonitorCheck:
      type: object
      additionalProperties: false
      required:
        - monitor_id
        - checked_at
        - status
        - latency_ms
        - network_failure
      properties:
        monitor_id:
          $ref: '#/components/schemas/UUID'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/MonitorStatus'
        latency_ms:
          type: integer
          minimum: 0
        status_code:
          type: integer
          minimum: 100
          maximum: 599
        network_failure:
          type: boolean
        failure_reason:
          type: string

    MonitorSLA:
      type: object
      additionalProperties: false
      required:
        - monitor_id
        - from
        - to
        - uptime_percentage
        - downtime_duration_sec
      properties:
        monitor_id:
          $ref: '#/components/schemas/UUID'
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        uptime_percentage:
          type: number
          minimum: 0
          maximum: 100
        downtime_duration_sec:
          type: integer
          minimum: 0

    MonitorStatusInterval:
      type: object
      additionalProperties: false
      required: [monitor_id, status, started_at]
      properties:
        monitor_id:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/MonitorStatus'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          $ref: '#/components/schemas/Timestamp'

    TelegramCredentials:
      type: object
      additionalProperties: false
      required: [chat_id, bot_token]
      properties:
        chat_id:
          type: integer
        bot_token:
          type: string
          minLength: 1
          writeOnly: true

    AlertContactCreate:
      type: object
      additionalProperties: false
      required: [name, platform, credentials]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          enum: [telegram]
        credentials:
          $ref: '#/components/schemas/TelegramCredentials'

    AlertContactPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        chat_id:
          type: integer
        bot_token:
          type: string
          minLength: 1
          writeOnly: true
        is_enabled:
          type: boolean

    AlertContact:
      type: object
      additionalProperties: false
      required: [id, name, platform, chat_id, is_enabled]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        platform:
          type: string
          enum: [telegram]
        chat_id:
          type: integer
        is_enabled:
          type: boolean

    OneTimeMaintenanceConfig:
      type: object
      additionalProperties: false
      required: [type, starts_at, ends_at]
      properties:
        type:
          type: string
          enum: [one_time]
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'

    ManualMaintenanceConfig:
      type: object
      additionalProperties: false
      required: [type, is_active]
      properties:
        type:
          type: string
          enum: [manual]
        is_active:
          type: boolean

    MaintenanceConfig:
      oneOf:
        - $ref: '#/components/schemas/OneTimeMaintenanceConfig'
        - $ref: '#/components/schemas/ManualMaintenanceConfig'
      discriminator:
        propertyName: type
        mapping:
          one_time: '#/components/schemas/OneTimeMaintenanceConfig'
          manual: '#/components/schemas/ManualMaintenanceConfig'

    MaintenanceWindowCreate:
      type: object
      additionalProperties: false
      required: [title, config]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        config:
          $ref: '#/components/schemas/MaintenanceConfig'
        monitor_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UUID'
          default: []

    MaintenanceWindowPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        config:
          $ref: '#/components/schemas/MaintenanceConfig'

    MaintenanceWindow:
      type: object
      additionalProperties: false
      required: [id, title, config, monitor_ids]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/MaintenanceConfig'
        monitor_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

