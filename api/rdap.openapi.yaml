openapi: 3.0.3
info:
  title: WatchTower domain registration
  version: 1.0.0
  description: Registration dates for the second-level .com domain of an owned HTTP(S) monitor, retrieved through RDAP.
paths:
  /monitors/{monitorId}/registration:
    get:
      operationId: getMonitorRegistration
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: monitorId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Registry registration record. Missing dates are null; registry expiration dates may change after renewal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          description: Invalid monitor ID or unsupported monitor endpoint; only valid ASCII .com HTTP(S) hosts are supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Monitor belongs to another user.
        '404':
          description: Monitor or registry record does not exist.
        '500':
          description: Monitor service unavailable.
        '502':
          description: Provider connection failed or returned a malformed response or redirect.
        '503':
          description: Integration disabled or provider rate limited the request.
        '504':
          description: Provider request timed out.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Registration:
      type: object
      required: [domain, registered_at, expires_at, source_url]
      properties:
        domain:
          type: string
          example: example.com
        registered_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        source_url:
          type: string
          format: uri
          example: https://rdap.verisign.com/com/v1/domain/example.com
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
