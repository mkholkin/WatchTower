services:
  backend:
    image: watchtower-backend:mfa-ui
    volumes:
      - ./build/run/mfa-config.json:/run/mfa-config.json:ro
    command: [/run/mfa-config.json]
  ui:
    environment:
      REACT_APP_AUTH_MFA: 'true'
      REACT_APP_MAILBOX_URL: http://localhost:8025
      REACT_APP_API_URL: http://localhost:8081
    volumes:
      - ./watchtower-ui/src:/app/src:ro
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - '127.0.0.1:8025:8025'
    networks: [watchtower-net]
